<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Oscilloscope Grid Lines -->
  <g opacity="0.15" stroke="#10b981" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160" stroke-dasharray="4,4" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="352" x2="432" y2="352" stroke-dasharray="4,4" />
    <line x1="160" y1="80" x2="160" y2="432" stroke-dasharray="4,4" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="352" y1="80" x2="352" y2="432" stroke-dasharray="4,4" />
  </g>

  <!-- Outer Speedometer / Telemetry Arc -->
  <path d="M 120 340 A 160 160 0 1 1 392 340" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="16" stroke-linecap="round" />
  <path d="M 120 340 A 160 160 0 1 1 340 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Latency Saturation Knee Curve & Waveform -->
  <path d="M 120 280 C 180 280, 220 270, 260 220 C 300 170, 340 140, 392 130" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Saturation Knee Optimal Dot -->
  <circle cx="260" cy="220" r="10" fill="#34d399" filter="url(#glow)" />
  <circle cx="260" cy="220" r="4" fill="#ffffff" />

  <!-- Dial Center Hub -->
  <circle cx="256" cy="300" r="24" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="4" />
  <circle cx="256" cy="300" r="8" fill="#34d399" />
  <!-- Indicator Needle -->
  <line x1="256" y1="300" x2="260" y2="228" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>

