<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1319" />
      <stop offset="50%" stop-color="#080f14" />
      <stop offset="100%" stop-color="#04080a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Top Accent Border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#borderGrad)" stroke-width="4" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Ambient Light Blobs -->
  <circle cx="160" cy="180" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)" />
  <circle cx="1040" cy="120" r="180" fill="#06b6d4" opacity="0.05" filter="url(#glow)" />

  <!-- LEFT: Graphic Icon Oscilloscope / Dial (180x180) -->
  <g transform="translate(70, 90)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="2" />
    <rect x="12" y="12" width="156" height="156" rx="26" fill="#0c1618" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />

    <!-- Oscilloscope grid lines -->
    <line x1="20" y1="90" x2="160" y2="90" stroke="rgba(16,185,129,0.2)" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="90" y1="20" x2="90" y2="160" stroke="rgba(16,185,129,0.2)" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Speedometer arc -->
    <path d="M 40 130 A 60 60 0 1 1 140 130" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="8" stroke-linecap="round" />
    <path d="M 40 130 A 60 60 0 1 1 125 65" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

    <!-- Saturation knee waveform curve -->
    <path d="M 30 115 C 60 115, 80 110, 100 80 C 120 50, 140 40, 155 35" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="100" cy="80" r="5" fill="#34d399" filter="url(#glow)" />

    <!-- Needle hub -->
    <circle cx="90" cy="120" r="10" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="2" />
    <line x1="90" y1="120" x2="100" y2="82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- RIGHT: Branding Text & Typography -->
  <g transform="translate(300, 68)">
    <!-- Monospace Pill Badge -->
    <g>
      <rect x="0" y="0" width="375" height="28" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#34d399" filter="url(#glow)" />
      <text x="28" y="18" fill="#34d399" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">EMPIRICAL SERVING LOAD-TEST &amp; TUNER</text>
    </g>

    <!-- Title -->
    <text x="0" y="94" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      servebench <tspan fill="#10b981" font-size="52">⚡</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      Empirical LLM Serving Benchmark, Knee Saturation &amp; NVML Telemetry Auto-Tuning
    </text>

    <!-- Feature Tags Strip -->
    <g transform="translate(2, 172)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="182" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🎯 Honest p99 (N ≥ 100)</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(192, 0)">
        <rect width="176" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">📊 MBU Roofline &amp; Knee</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(378, 0)">
        <rect width="178" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🔧 Auto-Tuner (`tune`)</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(566, 0)">
        <rect width="156" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🛡️ Zero CUDA OOMs</text>
      </g>

      <!-- Tag 5 -->
      <g transform="translate(732, 0)">
        <rect width="144" height="34" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🔐 Sigstore Signed</text>
      </g>
    </g>
  </g>
</svg>

