[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servebench"
version = "0.1.0"
description = "Load-test any OpenAI-compatible LLM endpoint: TTFT, TPOT, ITL, throughput, goodput, charts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Prajwal Pujari" }]
keywords = ["llm", "benchmark", "inference", "serving", "ttft", "openai", "vllm", "ollama", "llama.cpp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
fake = ["fastapi>=0.110", "uvicorn>=0.29"]
hf = ["transformers>=4.40"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
servebench = "servebench.cli:app"

[project.urls]
Homepage = "https://github.com/Prajwal7-2002/servebench"
Issues = "https://github.com/Prajwal7-2002/servebench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/servebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
