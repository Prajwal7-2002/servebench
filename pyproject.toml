[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "servebench"
version = "1.0.0"
description = "Load-test any OpenAI-compatible LLM endpoint: TTFT, TPOT, ITL, throughput, goodput, charts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Prajwal Pujari" }]
keywords = ["llm", "benchmark", "inference", "serving", "ttft", "openai", "vllm", "ollama", "llama.cpp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "aiohttp>=3.10",
    "pyyaml>=6.0.3",
    "nvidia-ml-py>=13.615.71",
]

[project.optional-dependencies]
mock = ["fastapi>=0.110", "uvicorn>=0.29"]
hf = ["transformers>=4.40"]

[dependency-groups]
# `uv sync` installs this group by default
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
servebench = "servebench.cli:app"

[project.urls]
Homepage = "https://github.com/Prajwal7-2002/servebench"
Issues = "https://github.com/Prajwal7-2002/servebench/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
